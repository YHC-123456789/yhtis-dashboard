name: YHTIS Daily Official Screen
on:
  schedule:
    # 11:30 UTC = 19:30 Taipei (04:30 Phoenix), Mon-Fri.
    - cron: '30 11 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: yhtis-official-screen
  cancel-in-progress: false
jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check known Taiwan market closures (never bypass strict quote validation)
        id: market_calendar
        run: python daily_screen/market_calendar_guard.py
      - name: Fetch dated official TWSE and TPEx quotes; screen or fail closed
        if: steps.market_calendar.outputs.skip != 'true'
        run: python daily_screen/screen.py --mode live --base daily_screen
      - name: Verify screen output before any commit
        if: steps.market_calendar.outputs.skip != 'true'
        run: python daily_screen/test_screen.py --verify-only
      - name: Commit ONLY isolated daily_screen outputs
        if: steps.market_calendar.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- daily_screen/history.csv daily_screen/latest.json daily_screen/screen.csv; then
            echo "NO_NEW_SESSION: no publication needed"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- daily_screen/history.csv daily_screen/latest.json daily_screen/screen.csv
          git diff --cached --quiet && exit 0
          git commit -m 'YHTIS official EOD observation screen update'
          git push origin HEAD:main
      - name: V5 sync official quotes, audit, compute (TOP 10 only if every check passes)
        id: v5
        if: steps.market_calendar.outputs.skip != 'true'
        continue-on-error: true
        run: |
          set -euo pipefail
          python v5/v5_live.py
          python v5/test_v5_live.py --verify-only
      - name: Commit ONLY V5 outputs (skipped when any V5 check failed)
        if: steps.market_calendar.outputs.skip != 'true' && steps.v5.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- v5/index.html v5/early_warning_latest.json v5/daytrade_watch.json output/official_market_eod_latest.json v5_history/rolling v5_history/first_seen.json)" ]; then
            echo "V5_NO_CHANGE"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- v5/index.html v5/early_warning_latest.json v5/daytrade_watch.json output/official_market_eod_latest.json v5_history/rolling v5_history/first_seen.json
          git commit -m 'YHTIS V5 research list update'
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Report V5 failure (daily_screen already published; V5 page unchanged)
        if: steps.v5.outcome == 'failure'
        run: |
          echo "::warning::V5 failed checks; V5 page left unchanged. See the V5 step log."
